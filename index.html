<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Night Shift Calculator</title>
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="NS Calculator" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon-192.svg" />
    <!-- iOS only takes a PNG here; with an SVG, Add to Home Screen falls
         back to a snapshot of the page. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint, so the loading screen and
      // app don't flash dark for light-theme users.
      (function () {
        try {
          var t =
            (JSON.parse(localStorage.getItem("nsc:v3") || "{}") || {}).theme ||
            "auto";
          if (t === "auto") {
            t =
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.getElementById("theme-color-meta");
          if (m)
            m.setAttribute("content", t === "light" ? "#f2f2f7" : "#000000");
        } catch (e) {}
      })();
      // Splash hand-off. The fire truck drives while the scripts load. Once
      // the app has mounted (app.jsx calls nscSplashDone), the truck dashes
      // off the road, the app logo drops in and bounces to rest in its
      // place, then the logo and title leap up into the header (crouch,
      // arc, overshoot, settle) while the page drops in beneath them. Screen entrances wait (nsc-booting) so they play as the splash
      // clears instead of hidden under it; nsc-intro makes that first
      // entrance fall from above rather than rise.
      (function () {
        var start = Date.now();
        var reduce =
          window.matchMedia &&
          matchMedia("(prefers-reduced-motion: reduce)").matches;
        var root = document.documentElement;
        root.classList.add("nsc-booting", "nsc-intro");
        var slow = setTimeout(function () {
          var sub = document.getElementById("nsc-splash-sub");
          if (sub) sub.textContent = "Still loading… check your connection";
        }, 12000);
        var later = function (fn, ms) {
          setTimeout(fn, reduce ? Math.min(ms, 350) : ms);
        };
        var finish = function (el) {
          root.classList.remove("nsc-booting", "nsc-handoff");
          if (el) el.remove();
          // The intro entrance has played; later screens rise as usual.
          later(function () {
            root.classList.remove("nsc-intro");
          }, 1400);
        };
        // A damped spring released from rest, as a function of t in [0, 1]:
        // it settles (to 0.2%) by t = 1 and is nudged to land exactly on 1.
        // z is the damping ratio: 0.62 overshoots ~8% (the app's
        // --ease-snappy), 0.78 ~2% (--ease-soft).
        var springFn = function (z) {
          var wn = Math.log(500) / z;
          var wd = wn * Math.sqrt(1 - z * z);
          var k = z / Math.sqrt(1 - z * z);
          var raw = function (t) {
            return (
              1 -
              Math.exp(-z * wn * t) * (Math.cos(wd * t) + k * Math.sin(wd * t))
            );
          };
          var miss = 1 - raw(1);
          return function (t) {
            return t <= 0 ? 0 : t >= 1 ? 1 : raw(t) + miss * t * t * t;
          };
        };
        var smooth = function (a, b, t) {
          var u = Math.min(1, Math.max(0, (t - a) / (b - a)));
          return u * u * (3 - 2 * u);
        };
        var rect = function (n) {
          var r = n && n.getBoundingClientRect();
          return r && r.width > 0 && r.height > 0 ? r : null;
        };
        // A new animation normally waits for the next frame to start, and
        // holds its first keyframe until then: a moving part taken over
        // mid-stride would stand still for a frame or two. Starting it at
        // this frame's time (the time its current position was read at)
        // carries the motion straight on.
        var startNow = function (a) {
          var now = document.timeline && document.timeline.currentTime;
          if (a && now != null) a.startTime = now;
          return a;
        };
        // Take a CSS-animated part over from wherever it is right now and
        // ease it to `to`, so changing what it's doing never makes it jump.
        var takeOver = function (node, to, ms, easing) {
          if (!node || !node.animate) return;
          var from = getComputedStyle(node).transform;
          node.style.animation = "none";
          node.style.transform = to;
          var frames = [
            { transform: from && from !== "none" ? from : "none" },
            { transform: to },
          ];
          try {
            startNow(node.animate(frames, { duration: ms, easing: easing }));
          } catch (e) {
            startNow(
              node.animate(frames, { duration: ms, easing: "ease-out" }),
            );
          }
        };

        // Floor it: the truck speeds up from wherever it is in its loop,
        // starting at the speed it was already driving at (so it never
        // stalls before pulling away), and accelerates steadily off the right
        // edge. Then call next. Without the animation API it just moves on.
        var dashOff = function (el, next) {
          var lane = el.querySelector(".nsc-lane");
          if (reduce || !lane || !lane.animate || !window.DOMMatrix) {
            return next();
          }
          try {
            var x = new DOMMatrix(getComputedStyle(lane).transform).m41;
            var end = lane.offsetWidth + 150;
            var left = Math.max(1, end - x);
            // Cruising speed (px/ms): the drive loop (nscDrive) covers the
            // lane plus the truck's width in 2.2s.
            var v0 = end / 2200;
            // Long enough to end about four times faster than it cruised,
            // short enough not to keep the app waiting.
            var ms = Math.max(
              left / (4 * v0),
              Math.min(200, (0.8 * left) / v0),
            );
            ms = Math.round(Math.min(560, ms));
            // Constant acceleration from v0: a quadratic, as a cubic-bezier
            // whose first handle sets the starting speed.
            var s0 = Math.min(0.8, (v0 * ms) / left);
            lane.style.animation = "none";
            lane.style.transform = "translateX(" + end + "px)";
            startNow(
              lane.animate(
                [
                  { transform: "translateX(" + x + "px)" },
                  { transform: "translateX(" + end + "px)" },
                ],
                {
                  duration: ms,
                  easing:
                    "cubic-bezier(0.3333, " +
                    (s0 / 3).toFixed(4) +
                    ", 0.6667, " +
                    ((1 + s0) / 3).toFixed(4) +
                    ")",
                },
              ),
            );
            // The weight shifts back: the nose lifts about the rear wheel
            // and the springs hold it there. The suspension's origin is at
            // (75px, 50.6px), so pivoting on the rear wheel (30px, 54.4px)
            // means moving there, turning, and moving back.
            takeOver(
              el.querySelector(".nsc-susp"),
              "translate(-45px, 3.75px) rotate(-3.5deg) translate(45px, -3.75px)",
              450,
              getComputedStyle(root).getPropertyValue("--ease-wobbly").trim() ||
                "ease-out",
            );
            // The bump is behind it now: wheels settle back onto the road.
            el.querySelectorAll(".nsc-hop").forEach(function (h) {
              takeOver(h, "none", 160, "ease-out");
            });
            // Faster streaks, from where each one already is.
            el.querySelectorAll(".nsc-speed").forEach(function (s) {
              (s.getAnimations ? s.getAnimations() : []).forEach(function (a) {
                if (a.updatePlaybackRate) a.updatePlaybackRate(1.8);
                else a.playbackRate = 1.8;
              });
            });
            el.classList.add("is-dashing");
            setTimeout(next, Math.max(0, ms - 140));
          } catch (e) {
            next();
          }
        };

        // Fly the splash logo and title onto the header's logo and title
        // (FLIP: measure both, animate the difference), dropping the splash
        // backdrop so the page comes in underneath. If the header isn't
        // measurable, fade the splash out as a whole instead.
        var flyHome = function (el) {
          var brand = el.querySelector(".nsc-brand");
          var title = el.querySelector(".nsc-splash-title");
          var toLogo = document.querySelector("[data-splash-target=logo]");
          var toTitle = document.querySelector("[data-splash-target=title]");
          var a = rect(brand);
          var b = rect(toLogo);
          if (reduce || !a || !b || !brand.animate) {
            el.classList.add("is-leaving");
            el.setAttribute("aria-hidden", "true");
            root.classList.remove("nsc-booting");
            later(function () {
              finish(el);
            }, 450);
            return;
          }
          var ms = 860;
          var s = b.width / a.width;
          var dx = b.left + b.width / 2 - (a.left + a.width / 2);
          var dy = b.top + b.height / 2 - (a.top + a.height / 2);
          var svg = brand.querySelector("svg");
          var radius =
            parseFloat(getComputedStyle(toLogo).borderTopLeftRadius) || 0;
          // The flight is worked out frame by frame rather than as a few
          // keyframes, because across and up need different timing: with
          // one easing for both, the logo came to a dead stop at the top of
          // its arc and then set off again. Each axis is a damped spring
          // (springFn): across overshoots the header logo a touch and comes
          // back; up leads (it rises before it moves across, like a jump)
          // and barely overshoots, so it never leaves the screen.
          var springX = springFn(0.62);
          var springY = springFn(0.78);
          var STEPS = 48; // one keyframe every ~18ms, joined linearly
          // Scale about the centre (the drop scales from the bottom, so it
          // can squash on landing); the measured centres then line up.
          brand.style.transformOrigin = "50% 50%";
          root.classList.add("nsc-handoff");
          el.classList.add("is-flying");
          el.setAttribute("aria-hidden", "true");
          // A jump, not a slide: it crouches with its base on the ground
          // (anticipation), stretches as it springs off, tilts into the
          // turn, and lands on the header logo's spot.
          var CROUCH = 0.14;
          var logoFrames = [];
          for (var i = 0; i <= STEPS; i++) {
            var t = i / STEPS;
            var tau = Math.max(0, (t - CROUCH) / (1 - CROUCH));
            var g = 1 + (s - 1) * springY(Math.min(1, tau * 1.1));
            var sq =
              t < CROUCH
                ? -0.1 * Math.sin((Math.PI / 2) * (t / CROUCH))
                : -0.1 +
                  0.18 * smooth(CROUCH, CROUCH + 0.1, t) -
                  0.08 * smooth(CROUCH + 0.1, 0.5, t);
            // While crouching, keep its base planted.
            var plant =
              Math.max(0, -sq) *
              (a.height / 2) *
              (1 - smooth(CROUCH, CROUCH + 0.08, t));
            var tilt = Math.sin(Math.PI * smooth(CROUCH, 0.7, t));
            logoFrames.push({
              transform:
                "translate(" +
                (dx * springX(tau)).toFixed(2) +
                "px, " +
                (dy * springY(Math.min(1, tau * 1.3)) + plant).toFixed(2) +
                "px) rotate(" +
                (-12 * tilt * tilt).toFixed(2) +
                "deg) scale(" +
                (g * (1 - sq * 0.8)).toFixed(4) +
                ", " +
                (g * (1 + sq)).toFixed(4) +
                ")",
            });
          }
          var flight = brand.animate(logoFrames, {
            duration: ms,
            easing: "linear",
            fill: "forwards",
          });
          if (svg) {
            svg.animate(
              [
                {
                  borderRadius: getComputedStyle(svg).borderTopLeftRadius,
                },
                { borderRadius: radius / s + "px", boxShadow: "none" },
              ],
              {
                duration: ms,
                easing: "cubic-bezier(0.45, 0, 0.15, 1)",
                fill: "forwards",
              },
            );
          }
          var c = rect(title);
          var d = rect(toTitle);
          if (c && d) {
            // The header title is left-aligned and may be a little smaller
            // (it scales with the screen), so pin the left edge. It follows
            // a beat behind the logo, like a tail, and rises later than the
            // logo does, so the logo is always clear above it.
            var ts =
              parseFloat(getComputedStyle(toTitle).fontSize) /
              parseFloat(getComputedStyle(title).fontSize);
            var tx = d.left - c.left;
            var ty = d.top + d.height / 2 - (c.top + c.height / 2);
            var titleFrames = [];
            for (var j = 0; j <= STEPS; j++) {
              var u = Math.max(0, (j / STEPS - 0.12) / 0.88);
              var qx = springX(u);
              titleFrames.push({
                transform:
                  "translate(" +
                  (tx * qx).toFixed(2) +
                  "px, " +
                  (ty * springY(Math.pow(u, 1.3))).toFixed(2) +
                  "px) scale(" +
                  (1 + (ts - 1) * qx).toFixed(4) +
                  ")",
              });
            }
            title.animate(titleFrames, {
              duration: ms - 90,
              delay: 80,
              easing: "linear",
              fill: "forwards",
            });
          } else {
            title.style.opacity = "0";
          }
          // Let the page start falling in once the logo has landed and the
          // title (trailing it) has risen past the first card, so the cards
          // don't fade in underneath either of them as they pass.
          setTimeout(function () {
            root.classList.remove("nsc-booting");
          }, ms * 0.6);
          // Swap to the real header logo on the flight's last frame (a timer
          // alone can fire a frame early); the timer is the backstop.
          var landed = false;
          var onLand = function () {
            if (landed) return;
            landed = true;
            finish(el);
            toLogo.classList.add("nsc-landed");
          };
          flight.onfinish = onLand;
          setTimeout(onLand, ms + 250);
        };

        window.nscSplashDone = function () {
          window.nscSplashDone = function () {};
          clearTimeout(slow);
          var el = document.getElementById("nsc-splash");
          if (!el) return finish(null);
          // Let the truck finish at least most of one pass on a fast load.
          var truckLeft = reduce ? 0 : Math.max(0, 900 - (Date.now() - start));
          setTimeout(function () {
            dashOff(el, function () {
              el.classList.add("is-ready");
              el.setAttribute("aria-busy", "false");
              later(function () {
                flyHome(el);
              }, 1250);
            });
          }, truckLeft);
        };
      })();
    </script>
  </head>
  <body>
    <!-- Loading screen: an overlay above the app (not inside #root), so it
         can hand over to the logo after React mounts. See nscSplashDone. -->
    <div id="nsc-splash" class="nsc-splash" role="status" aria-busy="true">
      <div class="nsc-sky" aria-hidden="true">
        <span class="nsc-moon"></span>
        <i class="nsc-star" style="top: 12%; left: 14%"></i>
        <i
          class="nsc-star is-big"
          style="top: 22%; left: 32%; animation-delay: -0.9s"
        ></i>
        <i
          class="nsc-star"
          style="top: 9%; left: 55%; animation-delay: -1.7s"
        ></i>
        <i
          class="nsc-star"
          style="top: 30%; left: 66%; animation-delay: -0.4s"
        ></i>
        <i
          class="nsc-star is-big"
          style="top: 14%; left: 86%; animation-delay: -2.1s"
        ></i>
        <i
          class="nsc-star"
          style="top: 34%; left: 9%; animation-delay: -1.2s"
        ></i>
        <i
          class="nsc-star"
          style="top: 27%; left: 46%; animation-delay: -2.4s"
        ></i>
        <i
          class="nsc-star"
          style="top: 6%; left: 75%; animation-delay: -0.6s"
        ></i>
      </div>
      <div class="nsc-stage">
        <div class="nsc-road" aria-hidden="true">
          <span class="nsc-bump"></span>
          <div class="nsc-lane">
            <div class="nsc-truck">
              <span class="nsc-speed nsc-speed-1"></span>
              <span class="nsc-speed nsc-speed-2"></span>
              <span class="nsc-speed nsc-speed-3"></span>
              <span class="nsc-puff nsc-puff-1"></span>
              <span class="nsc-puff nsc-puff-2"></span>
              <span class="nsc-puff nsc-puff-3"></span>
              <span class="nsc-puff nsc-puff-4"></span>
              <span class="nsc-puff nsc-puff-f1"></span>
              <span class="nsc-puff nsc-puff-f2"></span>
              <!-- Each moving part is its own layer (suspension, body,
                   lights, wheels), not a group inside one SVG: the browser
                   animates layers on the GPU, so the lights keep flashing
                   and the wheels keep turning while the app's scripts are
                   still compiling. The art is drawn in a 160 × 66 box at
                   150 × 62 (× 0.9375); styles.css places the layers. -->
              <span class="nsc-shadow"></span>
              <div class="nsc-susp">
                <div class="nsc-body">
                  <span class="nsc-glow nsc-glow-r"></span>
                  <span class="nsc-glow nsc-glow-b"></span>
                  <svg viewBox="0 0 160 66" width="150" height="62">
                    <defs>
                      <linearGradient id="nsc-beam-fill" x1="0" x2="1">
                        <stop
                          offset="0"
                          stop-color="#ffe7a3"
                          stop-opacity="0.55"
                        />
                        <stop
                          offset="1"
                          stop-color="#ffe7a3"
                          stop-opacity="0"
                        />
                      </linearGradient>
                    </defs>
                    <!-- Headlight beam -->
                    <path
                      class="nsc-beam"
                      d="M149 34 L240 18 L240 60 Z"
                      fill="url(#nsc-beam-fill)"
                    />
                    <!-- Ladder -->
                    <rect x="8" y="9" width="92" height="2.5" fill="#c9ced6" />
                    <rect x="8" y="14" width="92" height="2.5" fill="#c9ced6" />
                    <path
                      d="M14 9v7M24 9v7M34 9v7M44 9v7M54 9v7M64 9v7M74 9v7M84 9v7M94 9v7"
                      stroke="#c9ced6"
                      stroke-width="1.6"
                    />
                    <rect x="20" y="16" width="3" height="3" fill="#8a9099" />
                    <rect x="86" y="16" width="3" height="3" fill="#8a9099" />
                    <!-- Rear body -->
                    <rect
                      x="4"
                      y="19"
                      width="102"
                      height="33"
                      rx="3"
                      fill="#d62828"
                    />
                    <rect
                      x="10"
                      y="23"
                      width="26"
                      height="14"
                      rx="1.5"
                      fill="#b51f1f"
                    />
                    <rect
                      x="40"
                      y="23"
                      width="26"
                      height="14"
                      rx="1.5"
                      fill="#b51f1f"
                    />
                    <rect
                      x="70"
                      y="23"
                      width="30"
                      height="14"
                      rx="1.5"
                      fill="#b51f1f"
                    />
                    <!-- Cab -->
                    <path d="M104 52V21q0-4 4-4h26l14 15v20z" fill="#e63030" />
                    <path d="M121 21h12l11 12h-23z" fill="#9fd3f2" />
                    <path d="M108 21h10v12h-10z" fill="#9fd3f2" />
                    <!-- Stripe, bumper, headlight -->
                    <rect x="4" y="40" width="144" height="4" fill="#f4f1e8" />
                    <rect
                      x="145"
                      y="45"
                      width="8"
                      height="7"
                      rx="1.5"
                      fill="#3a3d44"
                    />
                    <rect
                      x="146"
                      y="34"
                      width="3.5"
                      height="4.5"
                      rx="1"
                      fill="#ffd34d"
                    />
                    <!-- Wheel arches -->
                    <path d="M18 52a14 14 0 0 1 28 0z" fill="#2a2c31" />
                    <path d="M112 52a14 14 0 0 1 28 0z" fill="#2a2c31" />
                  </svg>
                  <!-- Light bar, flashing red and blue -->
                  <span class="nsc-light nsc-light-r"></span>
                  <span class="nsc-light nsc-light-b"></span>
                </div>
              </div>
              <div class="nsc-hop nsc-hop-r">
                <div class="nsc-wheel">
                  <svg viewBox="21 43 22 22">
                    <circle cx="32" cy="54" r="11" fill="#1d1e22" />
                    <circle cx="32" cy="54" r="5" fill="#b9bec7" />
                    <path
                      d="M32 46v16M24 54h16"
                      stroke="#1d1e22"
                      stroke-width="2"
                    />
                  </svg>
                </div>
              </div>
              <div class="nsc-hop nsc-hop-f">
                <div class="nsc-wheel">
                  <svg viewBox="115 43 22 22">
                    <circle cx="126" cy="54" r="11" fill="#1d1e22" />
                    <circle cx="126" cy="54" r="5" fill="#b9bec7" />
                    <path
                      d="M126 46v16M118 54h16"
                      stroke="#1d1e22"
                      stroke-width="2"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- The app icon (icon-192.svg), drawn in as the truck leaves. -->
        <div class="nsc-brand" aria-hidden="true">
          <span class="nsc-brand-glow"></span>
          <span class="nsc-brand-wave"></span>
          <span class="nsc-dust nsc-dust-l"></span>
          <span class="nsc-dust nsc-dust-r"></span>
          <svg viewBox="0 0 192 192" width="96" height="96">
            <rect width="192" height="192" rx="42" fill="#0b0b0c" />
            <circle
              class="nsc-brand-ring"
              cx="96"
              cy="96"
              r="60"
              fill="none"
              stroke="#f4f4f5"
              stroke-width="6"
              transform="rotate(-90 96 96)"
            />
            <path
              class="nsc-brand-hands"
              d="M96 56 v40 l28 18"
              stroke="#f4f4f5"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <circle
              class="nsc-brand-dot"
              cx="138"
              cy="58"
              r="14"
              fill="#e0a43c"
            />
          </svg>
        </div>
      </div>
      <div class="nsc-splash-title">
        <span class="sr-only">Night Shift Calculator</span
        ><span aria-hidden="true" class="nsc-letters"
          ><span style="--d: 0">N</span><span style="--d: 1">i</span
          ><span style="--d: 2">g</span><span style="--d: 3">h</span
          ><span style="--d: 4">t</span><span style="--d: 5"> </span
          ><span style="--d: 6">S</span><span style="--d: 7">h</span
          ><span style="--d: 8">i</span><span style="--d: 9">f</span
          ><span style="--d: 10">t</span><span style="--d: 11"> </span
          ><span style="--d: 12">C</span><span style="--d: 13">a</span
          ><span style="--d: 14">l</span><span style="--d: 15">c</span
          ><span style="--d: 16">u</span><span style="--d: 17">l</span
          ><span style="--d: 18">a</span><span style="--d: 19">t</span
          ><span style="--d: 20">o</span><span style="--d: 21">r</span></span
        >
      </div>
      <div class="nsc-splash-sub" id="nsc-splash-sub">
        Loading<span class="nsc-dots" aria-hidden="true"
          ><i></i><i></i><i></i
        ></span>
      </div>
    </div>
    <div id="root"></div>
