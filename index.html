<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Night Shift Calculator</title>
    <meta name="theme-color" content="#161513" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="NS Calculator" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon-192.svg" />
    <link rel="apple-touch-icon" href="icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint, so the loading screen and
      // app don't flash dark for light-theme users.
      (function () {
        try {
          var t =
            (JSON.parse(localStorage.getItem("nsc:v3") || "{}") || {}).theme ||
            "auto";
          if (t === "auto") {
            t =
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.getElementById("theme-color-meta");
          if (m)
            m.setAttribute("content", t === "light" ? "#faf9f7" : "#161513");
        } catch (e) {}
      })();
      // Splash hand-off. The fire truck drives while the scripts load. Once
      // the app has mounted (app.jsx calls nscSplashDone), the truck dashes
      // off the road, the app logo draws itself in its place, then the logo
      // and title fly up into the header while the page drops in beneath
      // them. Screen entrances wait (nsc-booting) so they play as the splash
      // clears instead of hidden under it; nsc-intro makes that first
      // entrance fall from above rather than rise.
      (function () {
        var start = Date.now();
        var reduce =
          window.matchMedia &&
          matchMedia("(prefers-reduced-motion: reduce)").matches;
        var root = document.documentElement;
        root.classList.add("nsc-booting", "nsc-intro");
        var slow = setTimeout(function () {
          var sub = document.getElementById("nsc-splash-sub");
          if (sub) sub.textContent = "Still loading… check your connection";
        }, 12000);
        var later = function (fn, ms) {
          setTimeout(fn, reduce ? Math.min(ms, 350) : ms);
        };
        var finish = function (el) {
          root.classList.remove("nsc-booting", "nsc-handoff");
          if (el) el.remove();
          // The intro entrance has played; later screens rise as usual.
          later(function () {
            root.classList.remove("nsc-intro");
          }, 1400);
        };
        var rect = function (n) {
          var r = n && n.getBoundingClientRect();
          return r && r.width > 0 && r.height > 0 ? r : null;
        };

        // Accelerate the truck from wherever it is in its loop off the right
        // edge, then call next. Falls back to a plain fade if the browser
        // can't read or animate the lane.
        var dashOff = function (el, next) {
          var lane = el.querySelector(".nsc-lane");
          if (reduce || !lane || !lane.animate || !window.DOMMatrix) {
            return next();
          }
          try {
            var x = new DOMMatrix(getComputedStyle(lane).transform).m41;
            var end = lane.offsetWidth + 150;
            var left = Math.max(0, end - x);
            lane.style.animation = "none";
            lane.style.transform = "translateX(" + end + "px)";
            var ms = Math.round(Math.max(220, Math.min(520, left * 0.9)));
            lane.animate(
              [
                { transform: "translateX(" + x + "px)" },
                { transform: "translateX(" + end + "px)" },
              ],
              { duration: ms, easing: "cubic-bezier(0.55, 0, 0.9, 0.45)" },
            );
            el.classList.add("is-dashing");
            setTimeout(next, Math.max(0, ms - 140));
          } catch (e) {
            next();
          }
        };

        // Fly the splash logo and title onto the header's logo and title
        // (FLIP: measure both, animate the difference), dropping the splash
        // backdrop so the page comes in underneath. If the header isn't
        // measurable, fade the splash out as a whole instead.
        var flyHome = function (el) {
          var brand = el.querySelector(".nsc-brand");
          var title = el.querySelector(".nsc-splash-title");
          var toLogo = document.querySelector("[data-splash-target=logo]");
          var toTitle = document.querySelector("[data-splash-target=title]");
          var a = rect(brand);
          var b = rect(toLogo);
          if (reduce || !a || !b || !brand.animate) {
            el.classList.add("is-leaving");
            el.setAttribute("aria-hidden", "true");
            root.classList.remove("nsc-booting");
            later(function () {
              finish(el);
            }, 450);
            return;
          }
          var ms = 720;
          var ease = "cubic-bezier(0.45, 0, 0.15, 1)";
          var s = b.width / a.width;
          var dx = b.left + b.width / 2 - (a.left + a.width / 2);
          var dy = b.top + b.height / 2 - (a.top + a.height / 2);
          var svg = brand.querySelector("svg");
          var radius =
            parseFloat(getComputedStyle(toLogo).borderTopLeftRadius) || 0;
          root.classList.add("nsc-handoff");
          el.classList.add("is-flying");
          el.setAttribute("aria-hidden", "true");
          var flight = brand.animate(
            [
              { transform: "none" },
              {
                transform:
                  "translate(" + dx + "px, " + dy + "px) scale(" + s + ")",
              },
            ],
            { duration: ms, easing: ease, fill: "forwards" },
          );
          if (svg) {
            svg.animate(
              [
                {
                  borderRadius: getComputedStyle(svg).borderTopLeftRadius,
                },
                { borderRadius: radius / s + "px", boxShadow: "none" },
              ],
              { duration: ms, easing: ease, fill: "forwards" },
            );
          }
          var c = rect(title);
          var d = rect(toTitle);
          if (c && d) {
            // The header title is left-aligned and may be a little smaller
            // (it scales with the screen), so pin the left edge.
            var ts =
              parseFloat(getComputedStyle(toTitle).fontSize) /
              parseFloat(getComputedStyle(title).fontSize);
            title.animate(
              [
                { transform: "none" },
                {
                  transform:
                    "translate(" +
                    (d.left - c.left) +
                    "px, " +
                    (d.top + d.height / 2 - (c.top + c.height / 2)) +
                    "px) scale(" +
                    ts +
                    ")",
                },
              ],
              { duration: ms, easing: ease, fill: "forwards" },
            );
          } else {
            title.style.opacity = "0";
          }
          // Let the page start falling in once the logo is most of the way
          // up, so the cards don't fade in underneath it as it passes.
          setTimeout(function () {
            root.classList.remove("nsc-booting");
          }, ms * 0.55);
          // Swap to the real header logo on the flight's last frame (a timer
          // alone can fire a frame early); the timer is the backstop.
          var landed = false;
          var land = function () {
            if (landed) return;
            landed = true;
            finish(el);
            toLogo.classList.add("nsc-landed");
          };
          flight.onfinish = land;
          setTimeout(land, ms + 250);
        };

        window.nscSplashDone = function () {
          window.nscSplashDone = function () {};
          clearTimeout(slow);
          var el = document.getElementById("nsc-splash");
          if (!el) return finish(null);
          // Let the truck finish at least most of one pass on a fast load.
          var truckLeft = reduce ? 0 : Math.max(0, 900 - (Date.now() - start));
          setTimeout(function () {
            dashOff(el, function () {
              el.classList.add("is-ready");
              el.setAttribute("aria-busy", "false");
              later(function () {
                flyHome(el);
              }, 1050);
            });
          }, truckLeft);
        };
      })();
    </script>
  </head>
  <body>
    <!-- Loading screen: an overlay above the app (not inside #root), so it
         can hand over to the logo after React mounts. See nscSplashDone. -->
    <div id="nsc-splash" class="nsc-splash" role="status" aria-busy="true">
      <div class="nsc-stage">
        <div class="nsc-road" aria-hidden="true">
          <div class="nsc-lane">
            <div class="nsc-truck">
              <span class="nsc-speed nsc-speed-1"></span>
              <span class="nsc-speed nsc-speed-2"></span>
              <span class="nsc-speed nsc-speed-3"></span>
              <span class="nsc-puff nsc-puff-1"></span>
              <span class="nsc-puff nsc-puff-2"></span>
              <span class="nsc-puff nsc-puff-3"></span>
              <span class="nsc-puff nsc-puff-4"></span>
              <span class="nsc-puff nsc-puff-f1"></span>
              <span class="nsc-puff nsc-puff-f2"></span>
              <svg viewBox="0 0 160 66" width="150" height="62">
                <g class="nsc-body">
                  <!-- Ladder -->
                  <rect x="8" y="9" width="92" height="2.5" fill="#c9ced6" />
                  <rect x="8" y="14" width="92" height="2.5" fill="#c9ced6" />
                  <path
                    d="M14 9v7M24 9v7M34 9v7M44 9v7M54 9v7M64 9v7M74 9v7M84 9v7M94 9v7"
                    stroke="#c9ced6"
                    stroke-width="1.6"
                  />
                  <rect x="20" y="16" width="3" height="3" fill="#8a9099" />
                  <rect x="86" y="16" width="3" height="3" fill="#8a9099" />
                  <!-- Rear body -->
                  <rect
                    x="4"
                    y="19"
                    width="102"
                    height="33"
                    rx="3"
                    fill="#d62828"
                  />
                  <rect
                    x="10"
                    y="23"
                    width="26"
                    height="14"
                    rx="1.5"
                    fill="#b51f1f"
                  />
                  <rect
                    x="40"
                    y="23"
                    width="26"
                    height="14"
                    rx="1.5"
                    fill="#b51f1f"
                  />
                  <rect
                    x="70"
                    y="23"
                    width="30"
                    height="14"
                    rx="1.5"
                    fill="#b51f1f"
                  />
                  <!-- Cab -->
                  <path d="M104 52V21q0-4 4-4h26l14 15v20z" fill="#e63030" />
                  <path d="M121 21h12l11 12h-23z" fill="#9fd3f2" />
                  <path d="M108 21h10v12h-10z" fill="#9fd3f2" />
                  <!-- Light bar -->
                  <rect
                    class="nsc-light-r"
                    x="110"
                    y="12.5"
                    width="7"
                    height="4.5"
                    rx="1.5"
                    fill="#ff3b3b"
                  />
                  <rect
                    class="nsc-light-b"
                    x="117"
                    y="12.5"
                    width="7"
                    height="4.5"
                    rx="1.5"
                    fill="#3b82ff"
                  />
                  <!-- Stripe, bumper, headlight -->
                  <rect x="4" y="40" width="144" height="4" fill="#f4f1e8" />
                  <rect
                    x="145"
                    y="45"
                    width="8"
                    height="7"
                    rx="1.5"
                    fill="#3a3d44"
                  />
                  <rect
                    x="146"
                    y="34"
                    width="3.5"
                    height="4.5"
                    rx="1"
                    fill="#ffd34d"
                  />
                  <!-- Wheel arches -->
                  <path d="M18 52a14 14 0 0 1 28 0z" fill="#2a2c31" />
                  <path d="M112 52a14 14 0 0 1 28 0z" fill="#2a2c31" />
                </g>
                <g class="nsc-wheel">
                  <circle cx="32" cy="54" r="11" fill="#1d1e22" />
                  <circle cx="32" cy="54" r="5" fill="#b9bec7" />
                  <path
                    d="M32 46v16M24 54h16"
                    stroke="#1d1e22"
                    stroke-width="2"
                  />
                </g>
                <g class="nsc-wheel">
                  <circle cx="126" cy="54" r="11" fill="#1d1e22" />
                  <circle cx="126" cy="54" r="5" fill="#b9bec7" />
                  <path
                    d="M126 46v16M118 54h16"
                    stroke="#1d1e22"
                    stroke-width="2"
                  />
                </g>
              </svg>
            </div>
          </div>
        </div>
        <!-- The app icon (icon-192.svg), drawn in as the truck leaves. -->
        <div class="nsc-brand" aria-hidden="true">
          <span class="nsc-brand-glow"></span>
          <svg viewBox="0 0 192 192" width="96" height="96">
            <rect width="192" height="192" rx="42" fill="#0b0b0c" />
            <circle
              class="nsc-brand-ring"
              cx="96"
              cy="96"
              r="60"
              fill="none"
              stroke="#f4f4f5"
              stroke-width="6"
              transform="rotate(-90 96 96)"
            />
            <path
              class="nsc-brand-hands"
              d="M96 56 v40 l28 18"
              stroke="#f4f4f5"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <circle
              class="nsc-brand-dot"
              cx="138"
              cy="58"
              r="14"
              fill="#e0a43c"
            />
          </svg>
        </div>
      </div>
      <div class="nsc-splash-title">Night Shift Calculator</div>
      <div class="nsc-splash-sub" id="nsc-splash-sub">Loading…</div>
    </div>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="helpers.jsx"></script>
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="modals.jsx"></script>
    <script type="text/babel" src="templates.jsx"></script>
    <script type="text/babel" src="calendar.jsx"></script>
    <script type="text/babel" src="summary.jsx"></script>
    <script type="text/babel" src="share.jsx"></script>
    <script type="text/babel" src="reconcile.jsx"></script>
    <script type="text/babel" src="ytd.jsx"></script>
    <script type="text/babel" src="snapshots.jsx"></script>
    <script type="text/babel" src="home.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>

    <script>
      if (
        "serviceWorker" in navigator &&
        location.protocol !== "blob:" &&
        location.protocol !== "file:"
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
